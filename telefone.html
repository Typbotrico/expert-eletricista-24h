<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telefone Directcall integrado</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-width:0;height:100%;font:14px system-ui,Arial,sans-serif;background:#fff;color:#17324a}
body{overflow-x:hidden}.top{height:49px;background:#eff5fc;border-bottom:1px solid #d5e2ef;display:flex;align-items:center;gap:9px;justify-content:space-between;padding:8px 12px}.top strong{font-size:14px}.tag{font-size:11px;border:1px solid #bfd4e7;border-radius:20px;color:#35678c;padding:4px 9px;background:#fff}
#screen{min-height:560px;position:relative;background:#fff;overflow:hidden;padding:0 4px}
#fallback{padding:32px 16px;text-align:center;color:#53718a;font-size:13px}
#directcall-frame-web{position:absolute!important;top:0!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important;z-index:2!important;width:350px!important;max-width:100%!important;height:540px!important;overflow:hidden!important}
#directcall-app-web{display:block!important;width:100%!important;max-width:100%!important;height:505px!important;min-height:505px!important}
#directcall-frame-app-close{max-width:100%!important}
footer{background:#f6faff;border-top:1px solid #deebf4;min-height:44px;font-size:12px;line-height:1.4;padding:9px;color:#55738e}
@media(max-width:395px){#directcall-frame-web{width:100%!important;transform:none!important;left:0!important}#screen{padding:0}}
</style></head><body>
<div class="top"><strong>☎ Directcall APP</strong><span class="tag" id="status">Conectando</span></div>
<div id="screen"><div id="fallback">Inicializando telefone no navegador...</div></div>
<footer>Áudio pelo microfone e fone do computador. Confirme “Via navegador” no APP.</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://www.directcallsoft.com/api/app/novo/app/directcall-app-web.js"></script>
<script>
(()=>{'use strict';
const set=(message)=>{document.getElementById('status').textContent=message};
const inform=(type,extra={})=>window.parent.postMessage({source:'central-phone',type,...extra},location.origin);
const embed=()=>{const frame=document.getElementById('directcall-frame-web');const screen=document.getElementById('screen');if(!frame||!screen)return false;
 if(frame.parentNode!==screen)screen.appendChild(frame);
 frame.style.setProperty('position','absolute','important');frame.style.setProperty('left','50%','important');frame.style.setProperty('top','0','important');frame.style.setProperty('right','auto','important');frame.style.setProperty('bottom','auto','important');frame.style.setProperty('width','350px','important');frame.style.setProperty('height','540px','important');
 const child=document.getElementById('directcall-app-web');if(child){child.setAttribute('allow','microphone; autoplay');child.setAttribute('title','Telefone oficial Directcall');child.style.setProperty('width','100%','important');child.style.setProperty('height','505px','important')}
 document.getElementById('fallback').style.display='none';return true};
const app=()=>window.jQuery?.directcall_app?.();
function sendToBrowser(command){
 const frame=document.getElementById('directcall-app-web');
 if(!frame?.contentWindow||!frame.src)throw Error('APP WebRTC não foi carregado');
 const origin=new URL(frame.src,location.href).origin;
 if(origin!=='https://www.directcallsoft.com'&&origin!=='https://directcallsoft.com')throw Error('Origem do aplicativo Directcall inesperada');
 // Envia diretamente ao iframe oficial. O wrapper pode mudar sendTo para
 // app-desktop enquanto verifica o software local, independentemente do Chrome.
 frame.contentWindow.postMessage(command,origin);
 return true;
}
// O app oficial responde {state:true} após processar api.cmd.
// Isso confirma processamento do comando, não autenticação nem toque.
let pendingVendorAck=null,latestCallRequest=null,callEndedRelayed=false;
window.addEventListener('message',e=>{
 const f=document.getElementById('directcall-app-web');
 if(e.origin!=='https://www.directcallsoft.com'&&e.origin!=='https://directcallsoft.com')return;
 const message=e.data;
 // O aplicativo oficial envia {data:"Chamada encerrada!"} ao opener.
 // Quando essa mensagem alcança este quadro, encaminhamos ao atendente.
 // Não tratar acknowledgements {state:true} como finalização.
 if(message&&typeof message==='object'&&message.source==='central-autofila-extension'&&message.type==='ready'){
  if(e.source===f?.contentWindow)inform('hangup-bridge-ready',{detector:'local-chrome-extension',version:String(message.version||'')});
  return;
 }
 if(message&&typeof message==='object'&&message.source==='central-autofila-extension'&&['call-armed','call-started'].includes(message.type)){
  if(e.source===f?.contentWindow&&latestCallRequest&&message.requestId===latestCallRequest.id&&message.phone===latestCallRequest.phone){
    inform('hangup-bridge-state',{state:message.type,requestId:message.requestId,phone:message.phone,version:message.version||''});
  }
  return;
 }
 if(message&&typeof message==='object'&&message.data==='Chamada encerrada!'){
  if(latestCallRequest&&(!message.requestId||message.requestId===latestCallRequest.id)&&(!message.phone||message.phone===latestCallRequest.phone)&&!callEndedRelayed&&Date.now()-latestCallRequest.at<7200000){
   callEndedRelayed=true;
   inform('call-ended',{requestId:latestCallRequest.id,phone:latestCallRequest.phone,source:'directcall-hangup'});
  }
  return;
 }
 if(e.source!==f?.contentWindow||!message||typeof message!=='object'||message.state!==true||!pendingVendorAck)return;
 const pending=pendingVendorAck;pendingVendorAck=null;clearTimeout(pending.timer);
 inform(pending.type,{requestId:pending.id,ok:true,message:'APP recebeu e processou o comando; não confirma toque nem ligação atendida'});
});
function requestVendorAck(command,type,requestId){
 if(pendingVendorAck)throw Error('Aguarde o comando anterior terminar');
 if(!requestId)throw Error('Identificador da operação ausente');
 const id=String(requestId).slice(0,100);
 const timer=setTimeout(()=>{
  if(!pendingVendorAck||pendingVendorAck.id!==id)return;
  pendingVendorAck=null;inform(type,{requestId:id,ok:false,message:'O telefone Directcall não confirmou o processamento. Confira login e Via navegador no aplicativo.'});
 },3600);
 pendingVendorAck={id,type,timer};
 try{sendToBrowser(command)}catch(e){clearTimeout(timer);pendingVendorAck=null;throw e;}
}
function expand(){const provider=app();if(!provider||typeof provider.state!=='function')throw Error('Controle Directcall indisponível');provider.state(350,540);embed();setTimeout(embed,150);setTimeout(embed,400);}
async function init(){try{if(typeof window.jQuery?.directcall_app!=='function')throw Error('Biblioteca Directcall não carregada');
window.jQuery.directcall_app({state:'open',clicktocall:false,habilitar_menu_chamadas:true,habilitar_menu_sms:false,habilitar_menu_mensagem_de_voz:false});
if(typeof app()?.comando!=='function')throw Error('Comando Directcall não disponível');
set('Iniciando');
 const inner=document.getElementById('directcall-app-web');
 if(!inner)throw Error('O APP interno da Directcall não foi criado');
 const loaded=new Promise(resolve=>{if(inner.dataset.loaded==='yes')return resolve();inner.addEventListener('load',()=>{inner.dataset.loaded='yes';resolve()},{once:true});setTimeout(resolve,5000)});
 await loaded;
 // The official plugin defers its initial state by 3 seconds; do not let it
 // hide the phone after our UI reports ready.
 await new Promise(resolve=>setTimeout(resolve,3300));
 expand();set('Painel carregado');inform('ready',{mode:'app-web',confirmation:'plugin-only'});
 const target=document.getElementById('directcall-app-web');
 if(target?.contentWindow)target.contentWindow.postMessage({source:'central-extension',type:'probe'},new URL(target.src,location.href).origin);}
catch(e){set('Erro');document.getElementById('fallback').textContent=String(e?.message||e);inform('error',{message:String(e?.message||e)})}}
window.addEventListener('message',ev=>{if(ev.source!==window.parent||ev.origin!==location.origin)return;const m=ev.data;if(!m||m.source!=='central-operator')return;
if(m.type==='expand'){try{expand();inform('expanded')}catch(e){inform('error',{message:String(e?.message||e)})}}
if(m.type==='probe'){try{
 // O comando desconhecido "verificar" não inicia uma chamada. A aplicação
 // atual responde {state:true} para indicar que recebeu a mensagem.
 requestVendorAck('0|verificar|','probe-ack',m.requestId);
 }catch(e){inform('probe-ack',{requestId:String(m.requestId||''),ok:false,message:String(e?.message||e)})}
}
if(m.type==='dial'){try{
if(!/^55[1-9]\d{9,10}$/.test(String(m.phone||'')))throw Error('Número inválido');
const name=String(m.name||'Contato').replace(/[|\r\n]/g,' ').slice(0,70);
const id=String(m.id||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,70);
if(!id)throw Error('Identificador do contato ausente');
expand();
// O código real api.cmd do fornecedor só executa position=1 quando
// "Ligar a partir do software integrado" (actionCall) está habilitado.
// position=0 significa comando direto, acionado explicitamente pelo usuário.
// Campos: posição | chamar | telefone | ID | nome.
latestCallRequest={id:String(m.requestId||''),phone:String(m.phone||''),at:Date.now()};callEndedRelayed=false;
 // A extensão opcional monitora a tela interna de saída da Directcall.
 // Armamos apenas para o contato explicitamente discado nesta janela.
 const vendorFrame=document.getElementById('directcall-app-web');
 if(vendorFrame?.contentWindow){
  const vendorOrigin=new URL(vendorFrame.src,location.href).origin;
  vendorFrame.contentWindow.postMessage({source:'central-extension',type:'call-intent',requestId:String(m.requestId||''),phone:String(m.phone||'')},vendorOrigin);
 }

requestVendorAck('0|chamar|'+m.phone+'|'+id+'|'+name,'dial-ack',m.requestId);
}catch(e){inform('dial-ack',{requestId:String(m.requestId||''),ok:false,message:String(e?.message||e)})}
}});
const watcher=new MutationObserver(()=>{const root=document.getElementById('directcall-frame-web');if(root&&root.parentNode!==document.getElementById('screen'))embed()});
watcher.observe(document.body,{childList:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
